name: Update RSS feed

on:
  schedule:
    # Saturdays only: every 30 min from 18:00 to 23:30 UTC. Once that day's episode is
    # in the feed, the remaining runs exit immediately (see STOP_IF_TODAY_PRESENT below).
    - cron: "0,30 18-23 * * 6"
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # also rebuild right after you add/edit a tracklist
    paths:
      - "tracklists/**"
      - "gen_feed.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python gen_feed.py
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
          STOP_IF_TODAY_PRESENT: ${{ github.event_name == 'schedule' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml episodes.json
          git diff --staged --quiet || (git commit -m "Update feed" && git push)
