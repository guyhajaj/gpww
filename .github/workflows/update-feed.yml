name: Update RSS feed

on:
  schedule:
    - cron: "0 19 * * 6"    # every Saturday at 19:00 UTC
    - cron: "0 20 * * 6"    # every Saturday at 20:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # also rebuild right after you add/edit a tracklist
    paths:
      - "tracklists/**"
      - "gen_feed.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python gen_feed.py
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml episodes.json
          git diff --staged --quiet || (git commit -m "Update feed" && git push)
